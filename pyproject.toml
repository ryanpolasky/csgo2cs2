[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csgo2cs2"
version = "0.1.0"
description = "CLI orchestrator for porting CS:GO Steam Workshop maps to CS2."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ryan Polasky" },
]
dependencies = [
    "colorama>=0.4.6",
    "vpk>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6,<0.7",
]

[project.scripts]
csgo2cs2 = "csgo2cs2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live integration tests that contact Steam and run real BSPSource (opt-in via CSGO2CS2_LIVE_TEST=1)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
]
ignore = [
    "E501", # long lines (handled by formatter)
    "UP035", # deprecated typing imports we keep for clarity
    "UP006", # `Dict`/`List`/`Tuple` style we keep for clarity
    "UP007", # `Optional[X]` over `X | None` for readability
    "B008",  # default argument calls (false-positive on dataclass fields)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]
